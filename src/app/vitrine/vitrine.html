<div class="container mt-4">

                    <p class="mais-vendidos">
                        <strong> MAIS VENDIDOS </strong> 
                    </p>

    <div class="row">

        <div
            class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4"
            *ngFor="let obj of produtos">


            <div class="card">

                <img
                    class="card-img-top"
                    [src]="obj.codigo + '.jpg'"
                    [alt]="obj.nome">

                <div class="card-body">

                    <h4 class="card-title">
                        {{ obj.nome }}
                    </h4>

                    <p class="card-text" *ngIf="obj.promo > 0">
                        de: <s>R$ {{ obj.valor }}</s><br>
                        por: R$ {{ obj.promo }}
                    </p>

                    <p class="card-text" *ngIf="obj.promo <= 0">
                        por: R$ {{ obj.valor }}
                    </p>


                    <div class="botoes-produto">

    <a href="#" class="btn btn-primary">
        Ver mais...
    </a>

<button
    type="button"
    class="btn btn-success"
    *ngIf="obj.quantidade > 0"
    (click)="adicionarCesta(obj)">
    Comprar
</button>

</div>


                </div>

            </div>

        </div>

    </div>

</div>
